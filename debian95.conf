# Debian95 — the whole Desktop Edition, declared in one file.
#
# This is the reproducible source of truth for a Debian95 build: the invisible
# Debian engine + the Windows face + the policy. `tools/mk-debian.sh` reads it,
# so the entire OS is defined here — you own every choice, nothing is hidden, and
# any past generation can be rebuilt byte-for-byte from its copy of this file.
# (Borrows the Nix "whole OS in one file" idea; deeper reproducibility comes later.)
#
# Format: plain shell assignments (sourced by the build). Keep it declarative.

# ---- base engine ----
ARCH=amd64                 # amd64 | arm64 | i386
SUITE=bookworm             # Debian suite (bookworm stable; trixie for fresher libs)
HOSTNAME=debian95

# ---- policy (the Debian95 promises) ----
FIRMWARE_BLOBS=yes         # yes = non-free-firmware so real wifi/GPU work; no = purist
# The actual firmware PACKAGES to install when FIRMWARE_BLOBS=yes. Enabling the
# non-free-firmware component alone installs nothing; these blobs are what make
# real Wi-Fi chips and Intel/AMD display engines (KMS) come up on bare metal
# instead of a black screen. Ignored when FIRMWARE_BLOBS=no.
FIRMWARE="firmware-linux firmware-linux-nonfree firmware-misc-nonfree firmware-iwlwifi firmware-realtek firmware-atheros firmware-brcm80211 firmware-amd-graphics intel-microcode amd64-microcode"
FORCED_UPDATES=no          # no = disable apt-daily timers; user chooses when to update
TELEMETRY=no               # never; documented, auditable

# ---- boot chain ----
# Microsoft-signed shim + Debian-signed GRUB, so the USB boots on retail machines
# with Secure Boot ON (like real Windows) as well as OFF. mk-usb.sh copies the
# signed .efi binaries these packages drop into the rootfs onto the EFI partition.
BOOT="shim-signed grub-efi-amd64-signed grub-efi-amd64-bin"

# ---- the face ----
THEME=95                   # 95 | 98 | xp | flat  (Start > Settings > Theme also switches live)
USER=debian95               # the desktop account (non-root, for foreign apps like VLC)

# ---- the Windows Environment Layer: real services the Win95 shell fronts ----
# These make the shell a full control surface over the engine (network, sound,
# printers, removable media, software install). Kept explicit so you see exactly
# what the system can do.
SERVICES="network-manager pipewire pipewire-pulse wireplumber cups udisks2 policykit-1 cryptsetup cryptsetup-bin smbclient cifs-utils samba-common-bin cron openssh-client printer-driver-cups-pdf scrot espeak-ng x11vnc ufw btrfs-progs"

# ---- extra apps to install into the image (beyond the base) ----
# The Win95 "Add/Remove Programs" installs more at runtime via apt; this is just
# what ships preinstalled.
APPS="vlc dosbox remmina remmina-plugin-rdp remmina-plugin-vnc retroarch"

# ---- desktop runtime (Xorg + GL + toolkits; usually leave as-is) ----
# xserver-xorg-video-fbdev / -vesa are the fallback drivers debian95-startx tries if
# KMS modesetting can't drive the real GPU, so a first boot degrades to a working
# (if plain) framebuffer desktop instead of a black screen.
DESKTOP="xserver-xorg-core xserver-xorg-input-libinput xserver-xorg-video-modesetting xserver-xorg-video-fbdev xserver-xorg-video-vesa xinit x11-xserver-utils libgl1-mesa-dri libglx-mesa0 fontconfig fonts-dejavu-core libgtk-3-0 libqt5widgets5 ca-certificates wget"
